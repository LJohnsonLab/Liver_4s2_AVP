# Publishes the already-rendered book (report/_book) to GitHub Pages on every push to main.
# Rendering happens locally (quarto render report/); this only uploads the result.
name: Publish book
on:
  push:
    branches: [main]
    paths: ["report/_book/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: report/_book
      - id: deployment
        uses: actions/deploy-pages@v4
